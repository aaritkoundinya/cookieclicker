<!DOCTYPE html>
<html>
<head>
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gameBox">
        <h1>Cookie Clicker</h1>

        <p class="scoreText">Cookies: <span id="cookieCount">0</span></p>
        <p>Cookies per click: <span id="perClick">1</span></p>

        <button id="cookieButton">&#x1F36A;</button>

        <h2>Achievements</h2>
        <p id="achievementOne" hidden>10 cookies - good joob</p>
        <p id="achievementTwo" hidden>25 cookies - better job</p>
        <p id="achievementThree" hidden>50 cookies - nice job</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
